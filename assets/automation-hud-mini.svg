<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Antigravity Automation HD Logo">
  <defs>
    <!-- Left Wing Gradient: Electric Cyan to Deep Marine -->
    <linearGradient id="hdLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0084FF" />
      <stop offset="100%" stop-color="#0051C7" />
    </linearGradient>

    <!-- Right Wing Gradient: Royal Iris to Deep Indigo -->
    <linearGradient id="hdRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Zero-G Orbital Ring Gradient -->
    <linearGradient id="hdOrbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Quantum Core Flare -->
    <radialGradient id="hdCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Orbital Zero-G Ring (Tilted perspective horizon) -->
  <ellipse cx="50" cy="62" rx="44" ry="14" fill="none" stroke="url(#hdOrbit)" stroke-width="3" />

  <!-- Levitating Apex 'A' Wings -->
  <!-- Left Wing -->
  <path d="M 50,12 C 48.8,12 47.2,13.5 46.5,15.2 L 17,74 C 16.2,75.8 17.3,77.5 19.3,77.5 L 33,77.5 C 34.8,77.5 36.3,76.3 36.9,74.6 L 50,44 Z" 
        fill="url(#hdLeft)" />
  
  <!-- Right Wing -->
  <path d="M 50,12 C 51.2,12 52.8,13.5 53.5,15.2 L 83,74 C 83.8,75.8 82.7,77.5 80.7,77.5 L 67,77.5 C 65.2,77.5 63.7,76.3 63.1,74.6 L 50,44 Z" 
        fill="url(#hdRight)" />

  <!-- Superconductor Floating Core -->
  <circle cx="50" cy="53" r="12" fill="url(#hdCore)" />
  <circle cx="50" cy="53" r="5.5" fill="#0A0E17" />
  <circle cx="50" cy="53" r="2.5" fill="#00D2FF" />

  <!-- Apex Tip Glow -->
  <circle cx="50" cy="12" r="3" fill="#00D2FF" />
  <circle cx="50" cy="12" r="1.5" fill="#FFFFFF" />
</svg>
