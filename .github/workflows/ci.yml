name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Test Suite (Pytest)
        run: |
          python -m pytest -v

      - name: Build Standalone Executable (.exe)
        run: |
          python build_exe.py --onefile

      - name: Compute SHA256 Checksum
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 dist\Antigravity_CDP_Studio.exe | Format-List | Out-File dist\checksum-sha256.txt
          Get-Content dist\checksum-sha256.txt

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity_CDP_Studio-Windows-Build
          path: |
            dist/Antigravity_CDP_Studio.exe
            dist/checksum-sha256.txt
          if-no-files-found: error
          retention-days: 14
